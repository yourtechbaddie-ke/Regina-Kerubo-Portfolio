<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Login Lab — Dashboard</title><link rel="stylesheet" href="style.css"></head><body><nav><b>SECURE LOGIN LAB</b><span>SECURE SESSION / DASHBOARD</span></nav><main><section class="lab" style="min-height:75vh"><header><small>AUTHENTICATED SESSION</small><h2>Security Dashboard</h2></header><div class="workspace"><div><p id="welcome" class="status success">Secure demo session active.</p><button type="button" onclick="location.href='index.html'">BACK TO LAB</button><button type="button" onclick="logout()">SIGN OUT</button></div><aside><div><small>SESSION</small><b>01</b><span id="session">Active</span></div><div><small>IDENTITY</small><b>02</b><span id="identity">Protected</span></div><div><small>DEVICE</small><b>03</b><span id="device">Trusted</span></div></aside></div></section></main><footer>REGINA KERUBO / CYBERSECURITY PORTFOLIO <span>TRUST · RESILIENCE · CONTROL</span></footer><script>const data=JSON.parse(sessionStorage.getItem('secureLoginLabSession')||'null');if(!data){location.replace('index.html')}else{document.getElementById('identity').textContent=data.email;document.getElementById('device').textContent=data.remember?'Trusted device':'Session only'}function logout(){sessionStorage.removeItem('secureLoginLabSession');location.href='index.html'}</script></body></html>
