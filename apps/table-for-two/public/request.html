<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Table for Two — Request an Evening</title><link rel="stylesheet" href="style.css"></head><body><nav><b>TABLE FOR TWO</b><span>REQUEST / PRIVATE DINING</span></nav><main><section class="detail" style="min-height:75vh"><div><small>PRIVATE DINING REQUEST</small><h2>Tell us how you want<br><i>the evening to feel.</i></h2><p>Submit the details below to create your bespoke dining request.</p></div><form id="requestForm" style="max-width:620px;display:grid;gap:16px"><label>NAME<input id="name" required placeholder="Your name"></label><label>EMAIL<input id="email" type="email" required placeholder="you@example.com"></label><label>DATE<input id="date" type="date" required></label><label>GUESTS<select id="guests"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label><label>EXPERIENCE<select id="experience"><option>Chef's tasting</option><option>Romantic dinner</option><option>Celebration</option><option>Private culinary experience</option></select></label><label>NOTES<textarea id="notes" rows="5" placeholder="Dietary needs, occasion, preferences..."></textarea></label><button type="submit">SUBMIT DINING REQUEST ↗</button><button type="button" onclick="location.href='index.html'">BACK TO TABLE FOR TWO</button><p id="result" class="status"></p></form></section></main><footer>REGINA KERUBO / CULINARY PORTFOLIO <span>TASTE · ATMOSPHERE · MEMORY</span></footer><script>document.getElementById('requestForm').addEventListener('submit',e=>{e.preventDefault();const request={name:document.getElementById('name').value.trim(),email:document.getElementById('email').value.trim(),date:document.getElementById('date').value,guests:document.getElementById('guests').value,experience:document.getElementById('experience').value,notes:document.getElementById('notes').value.trim(),submittedAt:new Date().toISOString()};localStorage.setItem('tableForTwoRequest',JSON.stringify(request));const r=document.getElementById('result');r.textContent='Request received · your private dining brief has been saved.';r.className='status success';e.target.querySelector('button[type=submit]').disabled=true});</script></body></html>
